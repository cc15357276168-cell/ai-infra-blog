<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Write | ChenChen-blog</title><link rel="stylesheet" href="/src/style.css"></head><body><header class="topbar"><a class="brand" href="/">ChenChen-blog</a><a class="editor-home" href="/">View blog ↗</a></header><main class="editor-wrap"><p class="eyebrow">WRITING PAGE</p><h1>Write your blog post</h1><p class="editor-lead">Add a title, summary, and Markdown body. You can paste images directly into the body.</p><form id="editorForm"><section class="editor-section"><h2>Article information</h2><label>Title<input name="title" required></label><div class="field-row"><label>Category<input name="category" value="Notes" required></label><label>Tags<input name="tags" placeholder="AI, Engineering, Notes"></label><label>Reading time<input name="minutes" value="5 min" required></label></div><label>Summary<textarea name="excerpt" rows="3" required></textarea></label><label>Date<input name="date" type="date" required></label></section><section class="editor-section"><h2>Body</h2><label>Markdown content<textarea name="body" rows="14" required placeholder="Write here or paste an image"></textarea></label><p class="paste-tip">You can paste an image copied from a screenshot tool, chat app, or folder.</p></section><div class="editor-actions"><button class="save" type="submit">Save article</button><button class="reset" type="button" id="reset">Restore example</button><span id="notice"></span></div></form><section class="preview-box"><h2>Preview</h2><article id="preview" class="preview"></article></section></main><script type="module" src="/src/editor.js"></script></body></html>
