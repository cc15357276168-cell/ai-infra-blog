<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>写博客</title><link rel="stylesheet" href="/src/style.css"></head><body><header class="topbar"><a class="brand" href="/">AI Infra Notes</a><a class="editor-home" href="/">查看博客 ↗</a></header><main class="editor-wrap"><p class="eyebrow">写作页</p><h1>在这里写你的博客</h1><p class="editor-lead">填写标题、摘要和正文；复制图片后也可以直接粘贴到正文框。</p><form id="editorForm"><section class="editor-section"><h2>文章信息</h2><label>标题<input name="title" required></label><div class="field-row"><label>分类<input name="category" value="随笔" required></label><label>标签<input name="tags" placeholder="AI, 工程, 记录"></label><label>阅读时长<input name="minutes" value="5 分钟" required></label></div><label>摘要<textarea name="excerpt" rows="3" required></textarea></label><label>日期<input name="date" type="date" required></label></section><section class="editor-section"><h2>正文</h2><label>Markdown 内容<textarea name="body" rows="14" required placeholder="在这里写正文，也可以直接粘贴图片"></textarea></label><p class="paste-tip">支持从截图工具、微信或文件夹复制图片后粘贴。</p></section><div class="editor-actions"><button class="save" type="submit">保存文章</button><button class="reset" type="button" id="reset">恢复示例</button><span id="notice"></span></div></form><section class="preview-box"><h2>预览</h2><article id="preview" class="preview"></article></section></main><script type="module" src="/src/editor.js"></script></body></html>
